[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spanopticon-tests"
version = "0.2.0"
requires-python = ">=3.13"
description = "Explicitly configured PostgreSQL migration test fixtures"
dependencies = ["alembic>=1.16", "sqlalchemy>=2.0", "psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/spanopticon_tests"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "integration", "scripts", "pyproject.toml", "uv.lock", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
