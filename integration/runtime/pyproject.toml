[project]
name = "controlplane-owner-integration"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "acl-service @ git+https://github.com/hyperme-sh/acl-service.git@24729a0451831a487a1439c479ce1222b6f19248",
  "ai-service @ git+https://github.com/hyperme-sh/ai-service.git@a389a8093bf20d2e46c0771f149156ad3427d1e2",
  "marketplace-service @ git+https://github.com/hyperme-sh/marketplace-service.git@76bb9538edae3799916e80e7f192c6ee1031105d",
  "payment-service @ git+https://github.com/hyperme-sh/payment-service.git@4204046fe65b3a2b7f8e533bbe10a055c0198588",
  "user-service @ git+https://github.com/hyperme-sh/user-service.git@3c98ef115d63ab90c8db4ef047658b07dfb464c4#subdirectory=core/user-service",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "asgi-lifespan>=2.1",
  "httpx>=0.28",
  "respx>=0.22",
  "redis>=5",
  "testcontainers>=4.9"
]

[tool.uv]
package = false
override-dependencies = [
  "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@82fc8c2ca21531f1a3f7a695257b3465c4a347da",
  "auth-service @ git+https://github.com/hyperme-sh/auth-service.git@47fc18da54f80b821029424eaac02c27b051399d",
  "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@c46bf282a8f1a605cfb8acb9beafb474c0b1b0c8",
  "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@95ef61433374274f4a4fc287e15982be6357e1cc",
  "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@127d15fce7c3af8d8f8e239fb306ce88de76f02a",
  "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@f252909af772b2c820555af36de456d46f17cfcb",
  "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@2a49f9af5f6c4dc9d6c4ddebc83c41d6331e2c87",
  "spanopticon-models @ git+https://github.com/hyperme-sh/controlplane-models.git@9a9bbb20c2e0cd41febf3233ce7a48fe17a84b04"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: disposable owner stack", "phase2_step2: marketplace inference contract"]
