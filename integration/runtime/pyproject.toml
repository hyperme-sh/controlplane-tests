[project]
name = "controlplane-owner-integration"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "acl-service @ git+https://github.com/hyperme-sh/acl-service.git@878d0687125919cf5fda035971743d7bfbd3da35",
  "ai-service @ git+https://github.com/hyperme-sh/ai-service.git@051b4c9880ebd580b2c5442ff3ce4c3d9f36dee1",
  "marketplace-service @ git+https://github.com/hyperme-sh/marketplace-service.git@baec29549d6aaa4880bd418b719dfd8ecbd51717",
  "payment-service @ git+https://github.com/hyperme-sh/payment-service.git@83a99d5dcdd523b18ea97364f0d351b7b742bedb",
  "user-service @ git+https://github.com/hyperme-sh/user-service.git@071e31b043021a1137800baf5a27d21aa21694e4#subdirectory=core/user-service",
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "asgi-lifespan>=2.1",
  "httpx>=0.28",
  "testcontainers>=4.9"
]

[tool.uv]
package = false
override-dependencies = [
  "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@6bef00ce7fc630df5523dcd254f85d40d13d135e",
  "auth-service @ git+https://github.com/hyperme-sh/auth-service.git@4766edb227942d8a481a9b5b4d3c1af9f079fb58",
  "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@3aa01d738c3a20d0da37506a2b44d186a8496500",
  "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@a14a4a35b5dbb45b7b9050ad35fcc65b4ef8fc79",
  "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@fbdeb1c11f17fa192b7505355c64d1f0af1234dc",
  "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@9528e2e58463c44fd0affa58089d6fb1215da605",
  "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@d8bc887460c08f30c6a1dcb951bac042bad326a7",
  "spanopticon-models @ git+https://github.com/hyperme-sh/controlplane-models.git@476185cea7a8b37130b10f2bc31505925e88b07c"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: disposable owner stack", "phase2_step2: marketplace inference contract"]
